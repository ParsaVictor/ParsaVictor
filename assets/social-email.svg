<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .glyph { fill: #0D1117; font: 700 24px "JetBrains Mono", ui-monospace, monospace; }
    </style>
  </defs>

  <circle cx="50" cy="50" r="44" fill="#EA4335" filter="url(#glow)">
    <animate attributeName="r" values="41;45;41" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#F90001" stroke-width="2" stroke-opacity="0.5">
    <animate attributeName="r" values="44;50;44" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="50" y="58" text-anchor="middle" class="glyph">@</text>
</svg>

