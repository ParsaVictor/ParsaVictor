<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="100%">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#140709" />
      <stop offset="100%" stop-color="#22070C" />
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F90001" />
      <stop offset="100%" stop-color="#FFB000" />
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F90001" stop-opacity="0" />
      <stop offset="50%" stop-color="#F90001" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#F90001" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#F90001" stroke-opacity="0.05" />
    </pattern>
    <clipPath id="round"><circle cx="0" cy="0" r="22" /></clipPath>
  </defs>
  <style>
  text { font-family: "JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
  .kicker { fill:#FF6B57; font-size:15px; font-weight:700; letter-spacing:4px; }
  .title  { fill:#FFF5F0; font-size:30px; font-weight:800; }
  .live   { fill:#FFC2B8; font-size:14px; font-weight:700; letter-spacing:2px; }
  .lbl    { fill:#9A6A64; font-size:15px; font-weight:700; letter-spacing:2px; }
  .val    { fill:#FFF5F0; font-weight:800; }
  .foot   { fill:#8a5550; font-size:15px; }
  .rise   { opacity:0; animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .pulse  { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.35; transform: scale(1.8); } }
  .scan   { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1100px); } }

  .count  { fill:#FFC2B8; font-size:15px; font-weight:700; }
  .num    { fill:#6a3c3a; font-size:14px; font-weight:800; letter-spacing:2px; }
  .numHot { fill:#FFB000; font-size:16px; font-weight:800; letter-spacing:2px; }
  .who    { fill:#FFF5F0; font-size:17px; font-weight:800; }
  .when   { fill:#9A6A64; font-size:13px; }
  .msg    { fill:#FFC2B8; font-size:15px; }
  .open   { fill:#FFF5F0; font-size:23px; font-weight:800; }
  .openS  { fill:#FFB000; font-size:16px; font-weight:700; }
  .ghost  { fill:#4a2a2c; font-size:14px; font-weight:700; }
  .q      { fill:#FFB000; font-size:28px; font-weight:800; }
  .dash   { animation: march 1.2s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -15; } }
  .halo   { transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-in-out infinite; }
  @keyframes halo { 0%,100% { opacity:.15; } 50% { opacity:.55; } }
  .caret  { animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity:0; } }
</style>
  
  <rect width="900" height="346" rx="18" fill="url(#bg)" />
  <rect width="900" height="346" rx="18" fill="url(#grid)" />
  <rect x="0.5" y="0.5" width="899" height="345" rx="18" fill="none" stroke="#F90001" stroke-opacity="0.35" />
  <rect class="scan" x="0" y="0" width="140" height="346" fill="url(#sweep)" opacity="0.5" />
  <text x="40" y="50" class="kicker">// GUESTBOOK</text>
  <text x="40" y="88" class="title">Sign the wall</text>
  <text x="860" y="50" text-anchor="end" class="count">0 signed · #001 open</text>
  <g class="rise" style="animation-delay:0.15s">
    <rect x="27" y="115" width="272" height="176" rx="17" fill="#FFB000" class="halo" filter="url(#glow)" />
    <rect x="30" y="118" width="266" height="170" rx="14" fill="#1a110a" />
    <rect x="31" y="119" width="264" height="168" rx="13" fill="none" stroke="#FFB000" stroke-width="2" stroke-dasharray="8 7" class="dash" />
    <text x="50" y="152" class="numHot">#001 · OPEN</text>
    <g transform="translate(252 160)">
      <circle r="23" fill="none" stroke="#FFB000" stroke-width="2" stroke-dasharray="4 4" class="dash" />
      <text y="10" text-anchor="middle" class="q">?</text>
    </g>
    <text x="50" y="212" class="open">Be the first</text>
    <text x="50" y="238" class="open">to sign the wall<tspan fill="#FFB000" class="caret">▌</tspan></text>
    <text x="50" y="270" class="openS">2 questions · 30 sec →</text></g><g class="rise" style="animation-delay:0.27s">
    <rect x="315" y="119" width="264" height="168" rx="13" fill="none" stroke="#3a1a1d" stroke-width="1.5" stroke-dasharray="6 8" />
    <text x="334" y="152" class="num">#002</text>
    <circle cx="536" cy="160" r="22" fill="none" stroke="#3a1a1d" stroke-dasharray="4 5" />
    <rect x="334" y="202" width="150" height="10" rx="5" fill="#22111a" />
    <rect x="334" y="224" width="104" height="10" rx="5" fill="#22111a" />
    <text x="334" y="270" class="ghost">waiting…</text></g><g class="rise" style="animation-delay:0.39s">
    <rect x="599" y="119" width="264" height="168" rx="13" fill="none" stroke="#3a1a1d" stroke-width="1.5" stroke-dasharray="6 8" />
    <text x="618" y="152" class="num">#003</text>
    <circle cx="820" cy="160" r="22" fill="none" stroke="#3a1a1d" stroke-dasharray="4 5" />
    <rect x="618" y="202" width="150" height="10" rx="5" fill="#22111a" />
    <rect x="618" y="224" width="104" height="10" rx="5" fill="#22111a" />
    <text x="618" y="270" class="ghost">waiting…</text></g>
  <text x="40" y="326" class="foot">↳ click the wall to sign — your avatar and note land in the next slot</text>
</svg>
