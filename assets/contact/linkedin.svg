<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141019" /><stop offset="100%" stop-color="#1c0a0e" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A66C2" /><stop offset="100%" stop-color="#0A66C2" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" /><stop offset="50%" stop-color="#fff" stop-opacity="0.10" /><stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="card"><rect width="440" height="120" rx="18" /></clipPath>
  </defs>
  <style>
    text { font-family: "JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    .name   { fill:#FFF5F0; font-size:24px; font-weight:800; }
    .handle { fill:#FFC2B8; font-size:17px; }
    .cta    { fill:#FFF5F0; font-size:15px; font-weight:800; letter-spacing:1px; }
    .run    { stroke-dasharray: 0.16 0.84; animation: run 6s linear 0s infinite; }
    @keyframes run { to { stroke-dashoffset: -1; } }
    .sheen  { animation: sheen 6s ease-in-out 0s infinite; }
    @keyframes sheen { 0% { transform: translateX(-160px); } 30%,100% { transform: translateX(600px); } }
    .nudge  { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .ping   { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out 0.0s infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity:.7; } 100% { transform: scale(1.45); opacity:0; } }
  </style>

  <rect width="440" height="120" rx="18" fill="url(#bg)" />
  <g clip-path="url(#card)"><rect class="sheen" x="0" y="0" width="140" height="120" fill="url(#sheen)" /></g>
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#0A66C2" stroke-opacity="0.28" stroke-width="1.5" />
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#0A66C2" stroke-width="2.5" pathLength="1" class="run" filter="url(#glow)" />

  <rect x="22" y="22" width="76" height="76" rx="20" fill="none" stroke="#0A66C2" stroke-width="2" class="ping" />
  <rect x="22" y="22" width="76" height="76" rx="20" fill="url(#tile)" />
  <g transform="translate(60 60)"><g transform="translate(-20 -20) scale(1.6667)"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z" fill="#FFFFFF" /></g></g>

  <text x="120" y="52" class="name">LinkedIn</text>
  <text x="120" y="86" class="handle">in/parsa-karkooti</text>

  <g class="nudge">
    <rect x="308" y="20" width="112" height="28" rx="14" fill="#0A66C2" fill-opacity="0.18" stroke="#0A66C2" stroke-opacity="0.7" />
    <text x="364" y="39" text-anchor="middle" class="cta">Connect →</text>
  </g>
</svg>
