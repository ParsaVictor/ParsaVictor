<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141019" /><stop offset="100%" stop-color="#1c0a0e" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F6FC" /><stop offset="100%" stop-color="#F0F6FC" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" /><stop offset="50%" stop-color="#fff" stop-opacity="0.10" /><stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="card"><rect width="440" height="120" rx="18" /></clipPath>
  </defs>
  <style>
    text { font-family: "JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    .name   { fill:#FFF5F0; font-size:24px; font-weight:800; }
    .handle { fill:#FFC2B8; font-size:17px; }
    .cta    { fill:#FFF5F0; font-size:15px; font-weight:800; letter-spacing:1px; }
    .run    { stroke-dasharray: 0.16 0.84; animation: run 6s linear -4.5s infinite; }
    @keyframes run { to { stroke-dashoffset: -1; } }
    .sheen  { animation: sheen 6s ease-in-out 4.5s infinite; }
    @keyframes sheen { 0% { transform: translateX(-160px); } 30%,100% { transform: translateX(600px); } }
    .nudge  { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .ping   { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out 1.8s infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity:.7; } 100% { transform: scale(1.45); opacity:0; } }
  </style>

  <rect width="440" height="120" rx="18" fill="url(#bg)" />
  <g clip-path="url(#card)"><rect class="sheen" x="0" y="0" width="140" height="120" fill="url(#sheen)" /></g>
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#F0F6FC" stroke-opacity="0.28" stroke-width="1.5" />
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#F0F6FC" stroke-width="2.5" pathLength="1" class="run" filter="url(#glow)" />

  <rect x="22" y="22" width="76" height="76" rx="20" fill="none" stroke="#F0F6FC" stroke-width="2" class="ping" />
  <rect x="22" y="22" width="76" height="76" rx="20" fill="url(#tile)" />
  <g transform="translate(60 60)"><g transform="translate(-20 -20) scale(1.6667)"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#0D1117" /></g></g>

  <text x="120" y="52" class="name">GitHub</text>
  <text x="120" y="86" class="handle">@ParsaVictor</text>

  <g class="nudge">
    <rect x="308" y="20" width="112" height="28" rx="14" fill="#F0F6FC" fill-opacity="0.18" stroke="#F0F6FC" stroke-opacity="0.7" />
    <text x="364" y="39" text-anchor="middle" class="cta">Follow →</text>
  </g>
</svg>
