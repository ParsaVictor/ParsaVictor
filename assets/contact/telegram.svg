<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141019" /><stop offset="100%" stop-color="#1c0a0e" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26A5E4" /><stop offset="100%" stop-color="#26A5E4" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" /><stop offset="50%" stop-color="#fff" stop-opacity="0.10" /><stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="card"><rect width="440" height="120" rx="18" /></clipPath>
  </defs>
  <style>
    text { font-family: "JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    .name   { fill:#FFF5F0; font-size:24px; font-weight:800; }
    .handle { fill:#FFC2B8; font-size:17px; }
    .cta    { fill:#FFF5F0; font-size:15px; font-weight:800; letter-spacing:1px; }
    .run    { stroke-dasharray: 0.16 0.84; animation: run 6s linear -1.5s infinite; }
    @keyframes run { to { stroke-dashoffset: -1; } }
    .sheen  { animation: sheen 6s ease-in-out 1.5s infinite; }
    @keyframes sheen { 0% { transform: translateX(-160px); } 30%,100% { transform: translateX(600px); } }
    .nudge  { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .ping   { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out 0.6s infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity:.7; } 100% { transform: scale(1.45); opacity:0; } }
  </style>

  <rect width="440" height="120" rx="18" fill="url(#bg)" />
  <g clip-path="url(#card)"><rect class="sheen" x="0" y="0" width="140" height="120" fill="url(#sheen)" /></g>
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#26A5E4" stroke-opacity="0.28" stroke-width="1.5" />
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#26A5E4" stroke-width="2.5" pathLength="1" class="run" filter="url(#glow)" />

  <rect x="22" y="22" width="76" height="76" rx="20" fill="none" stroke="#26A5E4" stroke-width="2" class="ping" />
  <rect x="22" y="22" width="76" height="76" rx="20" fill="url(#tile)" />
  <g transform="translate(60 60)"><g transform="translate(-20 -20) scale(1.6667)"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" fill="#FFFFFF" /></g></g>

  <text x="120" y="52" class="name">Telegram</text>
  <text x="120" y="86" class="handle">@Parsa_Karkooti</text>

  <g class="nudge">
    <rect x="308" y="20" width="112" height="28" rx="14" fill="#26A5E4" fill-opacity="0.18" stroke="#26A5E4" stroke-opacity="0.7" />
    <text x="364" y="39" text-anchor="middle" class="cta">Message →</text>
  </g>
</svg>
