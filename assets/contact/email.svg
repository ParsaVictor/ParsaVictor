<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141019" /><stop offset="100%" stop-color="#1c0a0e" />
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA4335" /><stop offset="100%" stop-color="#EA4335" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" /><stop offset="50%" stop-color="#fff" stop-opacity="0.10" /><stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="card"><rect width="440" height="120" rx="18" /></clipPath>
  </defs>
  <style>
    text { font-family: "JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    .name   { fill:#FFF5F0; font-size:24px; font-weight:800; }
    .handle { fill:#FFC2B8; font-size:15px; }
    .cta    { fill:#FFF5F0; font-size:15px; font-weight:800; letter-spacing:1px; }
    .run    { stroke-dasharray: 0.16 0.84; animation: run 6s linear -3s infinite; }
    @keyframes run { to { stroke-dashoffset: -1; } }
    .sheen  { animation: sheen 6s ease-in-out 3s infinite; }
    @keyframes sheen { 0% { transform: translateX(-160px); } 30%,100% { transform: translateX(600px); } }
    .nudge  { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    .ping   { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out 1.2s infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity:.7; } 100% { transform: scale(1.45); opacity:0; } }
  </style>

  <rect width="440" height="120" rx="18" fill="url(#bg)" />
  <g clip-path="url(#card)"><rect class="sheen" x="0" y="0" width="140" height="120" fill="url(#sheen)" /></g>
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#EA4335" stroke-opacity="0.28" stroke-width="1.5" />
  <rect x="1" y="1" width="438" height="118" rx="17" fill="none" stroke="#EA4335" stroke-width="2.5" pathLength="1" class="run" filter="url(#glow)" />

  <rect x="22" y="22" width="76" height="76" rx="20" fill="none" stroke="#EA4335" stroke-width="2" class="ping" />
  <rect x="22" y="22" width="76" height="76" rx="20" fill="url(#tile)" />
  <g transform="translate(60 60)"><g transform="translate(-20 -20) scale(1.6667)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#FFFFFF" /></g></g>

  <text x="120" y="52" class="name">Email</text>
  <text x="120" y="86" class="handle">1.parsa.karkooti@gmail.com</text>

  <g class="nudge">
    <rect x="308" y="20" width="112" height="28" rx="14" fill="#EA4335" fill-opacity="0.18" stroke="#EA4335" stroke-opacity="0.7" />
    <text x="364" y="39" text-anchor="middle" class="cta">Write →</text>
  </g>
</svg>
