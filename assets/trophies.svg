  <style>
  text { font-family: "JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
  .kicker { fill:#FF6B57; font-size:15px; font-weight:700; letter-spacing:4px; }
  .title  { fill:#FFF5F0; font-size:30px; font-weight:800; }
  .live   { fill:#FFC2B8; font-size:14px; font-weight:700; letter-spacing:2px; }
  .lbl    { fill:#9A6A64; font-size:15px; font-weight:700; letter-spacing:2px; }
  .val    { fill:#FFF5F0; font-weight:800; }
  .foot   { fill:#8a5550; font-size:15px; }
  .rise   { opacity:0; animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .pulse  { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.35; transform: scale(1.8); } }
  .scan   { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1100px); } }

    .rank  { font-weight:900; }
    .tname { fill:#FFC2B8; font-size:16px; font-weight:700; }
    .tval  { fill:#FFF5F0; font-size:16px; font-weight:800; }
    .tnext { fill:#9A6A64; font-size:13px; font-weight:400; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .shine { animation: shine 4.5s ease-in-out infinite; }
    @keyframes shine { 0% { transform: skewX(-20deg) translateX(0); } 35%,100% { transform: skewX(-20deg) translateX(190px); } }
    .halo  { animation: halo 2.4s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity:.12; } 50% { opacity:.32; } }
  </style>
  
