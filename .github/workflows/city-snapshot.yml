name: Record GitHub City fly-around

on:
  schedule:
    # Weekly is plenty for a screenshot of a city that only grows commit by
    # commit, and it saves a Playwright + Chromium install every single day.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  snapshot:
    name: Record the live GithubCity page as a GIF
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Record the city
        run: node scripts/snapshot-city.mjs
        timeout-minutes: 30

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/city-snapshot.png assets/city-flyover.gif
          git diff --staged --quiet || git commit -m "chore: refresh city fly-around [skip ci]"
          git pull --rebase origin main
          git push
