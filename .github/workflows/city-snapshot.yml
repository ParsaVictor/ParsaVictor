name: Record GitHub City fly-around

on:
  schedule:
    # Weekly is plenty for a city that only grows commit by commit, and it
    # saves a slow software-WebGL recording every single day.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  record:
    name: Record the live GithubCity page as a GIF
    runs-on: ubuntu-latest
    # Software WebGL renders each frame in seconds; give the whole run room.
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Record the city
        run: node scripts/snapshot-city.mjs dist-city
        timeout-minutes: 60

      # Force-published as a single commit: the GIF is several MB, and keeping
      # every weekly version in main's history would bloat every clone.
      # A failed recording never reaches this step, so the last good GIF stays.
      - name: Publish to the city-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: city-output
          build_dir: dist-city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
