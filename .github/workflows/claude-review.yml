name: Claude code review

# Reviews every pull request and leaves inline comments. Needs one repository
# secret — CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or
# ANTHROPIC_API_KEY. Without it the job skips itself instead of failing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: No credentials configured
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repository secret to enable Claude reviews."

      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CREDENTIALS == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to a GitHub profile README repo. The
            scripts in scripts/ generate SVG assets from the GitHub API and
            GitHub Actions run them on a schedule. Focus on:
            - bugs in the generator scripts and workflows (wrong data, broken
              SVG/XML, escaping of user-controlled text such as guestbook issues);
            - workflow safety (permissions, triggers, anything an outside
              issue author could influence);
            - README rendering on GitHub, especially on a phone.
            Skip style nitpicks. Leave inline comments for specific lines and
            one short summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
