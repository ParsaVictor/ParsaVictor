name: Update README live data

on:
  schedule:
    # Refresh once a day so highlights/activity/releases/pins stay current.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    name: Refresh live-data blocks in README.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Nightly refresh and manual pushes can overlap with the snake build on
    # the same repo — serialize them so neither clobbers the other's commit.
    concurrency:
      group: profile-main-write
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update live-data blocks
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild the contribution skyline
        run: node scripts/gen-skyline.mjs > assets/skyline.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/skyline.svg
          git diff --staged --quiet || git commit -m "chore: refresh live README data [skip ci]"
          git pull --rebase origin main
          git push
