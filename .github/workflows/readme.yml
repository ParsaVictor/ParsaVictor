name: Update README live data

on:
  schedule:
    # Refresh once a day so stats, activity, releases and the index stay current.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  # A new guestbook signature should land on the wall right away, and closing
  # an issue is how a note gets taken down.
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

jobs:
  update:
    name: Refresh live-data blocks and generated graphics
    runs-on: ubuntu-latest
    # Issue events from anything other than the guestbook don't touch the page.
    # (On unlabeled the label is already gone from the issue, so check the
    # label the event is about instead.)
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'guestbook') || github.event.label.name == 'guestbook'
    permissions:
      contents: write
    # Nightly refresh and manual pushes can overlap with the snake build on
    # the same repo — serialize them so neither clobbers the other's commit.
    concurrency:
      group: profile-main-write
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update live-data blocks
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild the activity dashboard and trophies
        run: node scripts/gen-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild the guestbook wall
        run: node scripts/gen-guestbook.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild the contribution skyline
        run: node scripts/gen-skyline.mjs > assets/skyline.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/skyline.svg assets/activity-overview.svg assets/activity-pulse.svg assets/trophies.svg assets/guestbook.svg
          git diff --staged --quiet || git commit -m "chore: refresh live README data [skip ci]"
          git pull --rebase origin main
          git push
