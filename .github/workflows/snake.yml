name: Generate profile graphics

on:
  # Refresh twice a day so the graphics reflect recent contributions.
  schedule:
    - cron: "0 2,14 * * *"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:
  # Regenerate whenever the profile README changes.
  push:
    branches: [main]

jobs:
  generate:
    name: Build snake + 3D calendar, publish to output branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The README updater commits to main on a nightly schedule; serialize with
    # it so overlapping pushes can't clobber each other.
    concurrency:
      group: profile-main-write
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Render the contribution grid as a snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Render the contribution grid as an isometric 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect the 3D output alongside the snake
        # snk runs in a container as root, so dist/ is root-owned and the
        # runner user cannot write into it without taking ownership first.
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          cp profile-3d-contrib/*.svg dist/
          ls -la dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
