name: Generate contribution snake

on:
  # Refresh the animation twice a day so it reflects recent contributions.
  schedule:
    - cron: "0 2,14 * * *"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:
  # Regenerate whenever the profile README changes.
  push:
    branches: [main]

jobs:
  generate:
    name: Build and publish the snake SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Render the contribution grid as a snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
